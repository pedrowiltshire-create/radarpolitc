<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta http-equiv="Permissions-Policy" content="attribution-reporting=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), join-ad-interest-group=(), run-ad-auction=(), browsing-topics=()">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
<meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">

<title>Visão Geral | Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --border:rgba(255,255,255,.12);
  --text:#eaf5f2;
  --muted:#b9d6cd;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
}

.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.16;
  pointer-events:none;
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.65), rgba(5,9,12,.92) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}

.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.45;
  pointer-events:none;
}

.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(31,227,162,.22) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}

@keyframes sweep{ to{transform:rotate(360deg)} }

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 48px;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand .mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
}

.brand svg{ width:22px; height:22px; }

.brand .name{
  font-weight:700;
  font-size:14px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.brand .name span{
  display:block;
  color:var(--green);
  font-size:12px;
}

/* ===== MENU ===== */
.nav{
  display:flex;
  gap:20px;
}

.nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  padding:8px 12px;
  border-radius:12px;
  border:1px solid transparent;
  transition:.2s;
}

.nav a:hover{
  background:rgba(31,227,162,.06);
  border-color:rgba(31,227,162,.15);
  color:var(--green);
}

.nav a.active{
  color:var(--green);
  background:rgba(31,227,162,.08);
  border:1px solid rgba(31,227,162,.18);
}

/* ===== CONTEÚDO ===== */
.main{
  position:relative;
  z-index:2;
  padding:40px 48px 54px;
}

.container{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:80px;
  align-items:center;
}

.photo{
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:48px;
  background:#0b1412;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content h1{
  color:var(--green);
  font-size:44px;
  font-weight:800;
  text-transform:uppercase;
  font-style:italic;
}

.content p{
  color:var(--muted);
  font-size:15.5px;
  line-height:1.75;
}

/* ===== RESPONSIVO ===== */
@media(max-width:900px){
  .container{ grid-template-columns:1fr; gap:42px; }
}

@media(max-width:700px){
  .header{ flex-direction:column; align-items:flex-start; }
  .nav{ flex-wrap:wrap; }
  .content h1{ font-size:30px; }
}
</style>
</head>

<body>

<div class="background">
  <img class="bg-map" src="mapa.png" alt="">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name"><span>RADAR</span> POLÍTICO</div>
  </div>

  <nav class="nav">
    <a class="active" href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=V-Geral">Visão Geral</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=N-Servi%C3%A7os">Serviços</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=M-Radar">Módulos do Radar</a>
  </nav>
</header>

<main class="main">
  <section class="container">
    <div class="photo">
      <img src="equipe.jpg" alt="">
    </div>

    <div class="content">
      <h1>PLATAFORMA COMPLETA<br>PARA GESTÃO DE CAMPANHAS</h1>
      <p><strong>Radar Político</strong> é uma solução digital para campanhas modernas.</p>
      <p>Gestão, comunicação, controle financeiro e análise estratégica em um só lugar.</p>
    </div>
  </section>
</main>

<script>
/* Limpeza segura de Service Workers */
(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => {
        if (r.scope.includes('radarpolitico')) {
          r.unregister();
        }
      });
    });
  }
})();
</script>

</body>
</html>
