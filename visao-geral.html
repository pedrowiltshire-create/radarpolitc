<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visão Geral | Radar Político</title>

<style>
:root{
--green:#1fe3a2;
--bg:#05090c;
--text:#eaf5f2;
--muted:#b9d6cd;
}
*{box-sizing:border-box}
html,body{
margin:0;
min-height:100%;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:var(--bg);
color:var(--text);
}
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 48px;
}
.brand{display:flex;gap:12px;align-items:center}
.brand .mark{
width:38px;height:38px;border-radius:12px;
background:rgba(31,227,162,.12);
border:1px solid rgba(31,227,162,.35);
display:grid;place-items:center;
}
.brand svg{width:22px;height:22px}
.brand .name{font-weight:700;font-size:14px;letter-spacing:.14em}
.brand .name span{display:block;color:var(--green);font-size:12px}
.nav{display:flex;gap:20px}
.nav a{
cursor:pointer;
padding:8px 12px;
border-radius:12px;
text-decoration:none;
color:var(--text);
}
.nav a.active{color:var(--green);border:1px solid rgba(31,227,162,.3)}
.main{padding:48px}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name"><span>RADAR</span>POLÍTICO</div>
  </div>

  <nav class="nav">
    <a data-page="V-Geral">Visão Geral</a>
    <a data-page="N-Servicos">Serviços</a>
    <a data-page="M-Radar">Módulos</a>
  </nav>
</header>

<main class="main">
  <h1>Plataforma completa para campanhas políticas</h1>
  <p class="muted">
    Gestão, análise territorial, comunicação e controle estratégico em um único sistema.
  </p>
</main>

<script>
(function () {
  'use strict';

  const EXPERIENCE_ID = '1c71651ddc4842a585a30dbdbd451a9c';
  const BASE_URL =
    'https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/';

  function buildUrl(page) {
    return `${BASE_URL}?id=${EXPERIENCE_ID}&page=${page}`;
  }

  function navigateTo(page) {
    if (!page) return;
    window.location.href = buildUrl(page);
  }

  function updateActiveNav() {
    const params = new URLSearchParams(window.location.search);
    const currentPage = params.get('page') || 'V-Geral';

    document.querySelectorAll('.nav a[data-page]').forEach(link => {
      link.classList.toggle('active', link.dataset.page === currentPage);
    });
  }

  document.querySelectorAll('.nav a[data-page]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      navigateTo(link.dataset.page);
    });
  });

  document.addEventListener('DOMContentLoaded', updateActiveNav);
  window.addEventListener('pageshow', updateActiveNav);
})();
</script>

</body>
</html>
