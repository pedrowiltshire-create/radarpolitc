<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta http-equiv="Permissions-Policy" content="attribution-reporting=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), join-ad-interest-group=(), run-ad-auction=(), browsing-topics=()">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
<meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">

<title>Visão Geral | Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --border:rgba(255,255,255,.12);
  --text:#eaf5f2;
  --muted:#b9d6cd;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:.16;
  pointer-events:none;
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.65), rgba(5,9,12,.92) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}

.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.45;
  pointer-events:none;
}

.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(31,227,162,.22) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}

@keyframes sweep{ to{transform:rotate(360deg)} }

@media (prefers-reduced-motion: reduce){
  .radar::after{ animation:none; }
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 48px;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand .mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
  box-shadow:0 0 24px rgba(31,227,162,.18);
}

.brand svg{ width:22px; height:22px; }

.brand .name{
  font-weight:700;
  font-size:14px;
  letter-spacing:.14em;
  text-transform:uppercase;
  line-height:1.1;
}

.brand .name span{
  display:block;
  color:var(--green);
  font-size:12px;
  letter-spacing:.22em;
}

/* ===== MENU ===== */
.nav{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  padding:8px 12px;
  border-radius:12px;
  border:1px solid transparent;
  transition:all .2s ease;
  white-space:nowrap;
  cursor:pointer;
}

.nav a:hover{
  background:rgba(31,227,162,.06);
  border-color:rgba(31,227,162,.15);
  color:var(--green);
  transform:translateY(-1px);
}

.nav a.active{
  color:var(--green);
  background:rgba(31,227,162,.08);
  border:1px solid rgba(31,227,162,.18);
}

/* ===== CONTEÚDO ===== */
.main{
  position:relative;
  z-index:2;
  padding:40px 48px 54px;
}

.container{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:80px;
  align-items:center;
}

.photo{
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:48px;
  background:#0b1412;
  border:1px solid rgba(255,255,255,.08);
  transition:transform .3s ease, border-color .3s ease;
}

.photo:hover{
  transform:scale(1.02);
  border-color:rgba(31,227,162,.2);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.content h1{
  color:var(--green);
  font-size:44px;
  font-weight:800;
  text-transform:uppercase;
  font-style:italic;
  letter-spacing:.04em;
  line-height:1.15;
  margin:0 0 24px;
}

.content p{
  color:var(--muted);
  font-size:15.5px;
  line-height:1.75;
  margin:0 0 16px;
}

.content p:last-child{
  margin-bottom:0;
}

/* ===== RESPONSIVO ===== */
@media(max-width:900px){
  .header{
    padding:18px 32px;
  }
  .main{
    padding:32px;
  }
  .container{ 
    grid-template-columns:1fr; 
    gap:42px; 
  }
  .photo{
    max-width:500px;
    margin:0 auto;
  }
}

@media(max-width:700px){
  .header{ 
    flex-direction:column; 
    align-items:flex-start;
    padding:16px 20px;
    gap:16px;
  }
  .nav{ 
    gap:12px;
    width:100%;
    justify-content:flex-start;
  }
  .nav a{
    font-size:13px;
    padding:8px 10px;
  }
  .main{
    padding:24px 20px;
  }
  .container{
    gap:32px;
  }
  .photo{
    border-radius:32px;
  }
  .content h1{ 
    font-size:30px;
    margin-bottom:18px;
  }
  .content p{
    font-size:14.5px;
  }
}

@media(max-width:400px){
  .header{
    padding:14px 16px;
  }
  .brand .name{
    font-size:12px;
  }
  .brand .name span{
    font-size:11px;
  }
  .nav{
    flex-direction:column;
    gap:8px;
  }
  .nav a{
    width:100%;
    text-align:center;
  }
  .main{
    padding:20px 16px;
  }
  .photo{
    border-radius:24px;
  }
  .content h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="background">
  <img class="bg-map" src="mapa.png" alt="Mapa do Brasil" onerror="this.style.display='none'">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3" aria-hidden="true">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name">
      <span>RADAR</span>
      POLÍTICO
    </div>
  </div>

<nav class="nav" role="navigation" aria-label="Menu principal">
  <a href="#" data-page="V-Geral">Visão Geral</a>
  <a href="#" data-page="N-Servicos">Serviços</a>
  <a href="#" data-page="M-Radar">Módulos do Radar</a>
</nav>
</header>

<main class="main">
  <section class="container">
    <div class="photo">
      <img src="equipe.jpg" alt="Equipe Radar Político" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22%3E%3Crect fill=%22%230b1412%22 width=%22600%22 height=%22600%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%231fe3a2%22 font-family=%22system-ui%22 font-size=%2224%22%3ERadar Político%3C/text%3E%3C/svg%3E'">
    </div>

    <div class="content">
      <h1>PLATAFORMA COMPLETA<br>PARA GESTÃO DE CAMPANHAS</h1>
      <p><strong>Radar Político</strong> é uma solução digital para campanhas modernas.</p>
      <p>Gestão, comunicação, controle financeiro e análise estratégica em um só lugar.</p>
    </div>
  </section>
</main>

<script>
/* ===== Navegação estável – ArcGIS Experience Builder (MESMA ABA) ===== */
(function () {

  // Evita múltiplas inicializações
  if (window.__RADAR_NAV__) return;
  window.__RADAR_NAV__ = true;

  const EXPERIENCE_ID = '1c71651ddc4842a585a30dbdbd451a9c';
  const BASE_URL =
    'https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/';
  const BASE_URL = 'https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/';

  function buildUrl(page) {
    return `${BASE_URL}?id=${EXPERIENCE_ID}&page=${page}`;
  }

  function navigateTo(page) {
    if (!page) return;

    const targetUrl = buildUrl(page);

    // 🔥 navegação direta na MESMA ABA
    window.location.href = targetUrl;
  }

  function updateActiveNav() {
    const params = new URLSearchParams(window.location.search);
    const currentPage = params.get('page') || 'V-Geral';

    document.querySelectorAll('.nav a[data-page]').forEach(link => {
      link.classList.toggle(
        'active',
        link.dataset.page === currentPage
      );
      link.classList.toggle('active', link.dataset.page === currentPage);
    });
  }

  // Delegação de evento (robusto)
  document.addEventListener('click', function (e) {
    const link = e.target.closest('.nav a[data-page]');
    if (!link) return;

    e.preventDefault();
    navigateTo(link.dataset.page);
  // Event listener usando onclick diretamente nos links
  document.querySelectorAll('.nav a[data-page]').forEach(link => {
    link.onclick = function(e) {
      e.preventDefault();
      navigateTo(this.dataset.page);
    };
  });

  updateActiveNav();

})();
</script>





</body>
</html>
