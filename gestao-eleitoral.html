<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Permissions-Policy" content="attribution-reporting=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), join-ad-interest-group=(), run-ad-auction=(), browsing-topics=()">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
<meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
<title>Gestão Eleitoral | Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --border:rgba(255,255,255,.12);
  --text:#eaf5f2;
  --muted:#b9d6cd;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== CAMADAS DE FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

/* MAPA FULLSCREEN */
.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:.22;
  filter: contrast(1.05);
  transform: scale(1.02);
  pointer-events:none;
}

/* overlay pra harmonizar o mapa com o fundo */
.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.65), rgba(5,9,12,.92) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}

/* ===== RADAR FUNDO ===== */
.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.55;
  pointer-events:none;
}

.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(31,227,162,.22) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}

@keyframes sweep{
  to{transform:rotate(360deg)}
}

@media (prefers-reduced-motion: reduce){
  .radar::after{ animation:none; }
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 48px;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.brand .mark{
  width:38px; 
  height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
  box-shadow:0 0 24px rgba(31,227,162,.18);
}

.brand svg{ 
  width:22px; 
  height:22px; 
}

.brand .name{
  font-weight:700;
  letter-spacing:.14em;
  font-size:14px;
  text-transform:uppercase;
  line-height:1.1;
}

.brand .name span{
  display:block;
  color:var(--green);
  letter-spacing:.22em;
  font-weight:700;
  font-size:12px;
}

.nav{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  padding:8px 12px;
  border-radius:12px;
  transition:all .2s ease;
  border:1px solid transparent;
  white-space:nowrap;
}

.nav a:hover{
  background:rgba(31,227,162,.06);
  border-color:rgba(31,227,162,.15);
  color:var(--green);
  transform:translateY(-1px);
}

.nav a.active{
  color:var(--green);
  background:rgba(31,227,162,.08);
  border:1px solid rgba(31,227,162,.18);
}

/* ===== RESPONSIVO ===== */
@media(max-width:700px){
  .header{
    padding:18px 32px;
    flex-direction:column;
    align-items:flex-start;
    gap:16px;
  }
  
  .nav{
    gap:12px;
    width:100%;
    justify-content:flex-start;
  }
  
  .nav a{
    font-size:13px;
    padding:8px 10px;
  }
  
  .bg-map{
    opacity:.12;
    object-position:center center;
  }
}
</style>
</head>

<body>

<!-- FUNDO COM RADAR ANIMADO -->
<div class="background">
  
  <!-- MAPA FUNDO - mapa.png na mesma pasta -->
  <div class="background">
  <img class="bg-map" src="mapa.png" alt="Mapa do Brasil" onerror="this.style.display='none'">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>
  
  <!-- overlay de harmonização -->
  <div class="bg-overlay"></div>

  <!-- radar -->
  <div class="radar"></div>
</div>

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name">
      <span>RADAR</span>
      POLÍTICO
    </div>
  </div>

  <nav class="nav">
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=V-Geral">Visão Geral</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=N-Servi%C3%A7os">Serviços</a>
    <a class="active" href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=Gestão Eleitoral">Gestão Eleitoral</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=M-Radar">Módulos do Radar</a>
  </nav>
</header>

</body>
<script>
(function() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        if(registration.scope.includes('radarpolitico')) {
          registration.unregister();
        }
      }
    });
  }

  let canNavigate = true;
  const navLinks = document.querySelectorAll('.nav a, .menu-item, .btn');
  
  navLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      if (!canNavigate) {
        e.preventDefault();
        return false;
      }
      canNavigate = false;
      setTimeout(function() { canNavigate = true; }, 1500);
    });
  });
})();
</script>
</html>
