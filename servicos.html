<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serviços | Radar Político</title>
<link rel="stylesheet" href="estilo-base.css">
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="mark">●</div>
    <div class="name"><span>RADAR</span>POLÍTICO</div>
  </div>
  <nav class="nav">
    <a data-page="V-Geral">Visão Geral</a>
    <a data-page="N-Servicos">Serviços</a>
    <a data-page="M-Radar">Módulos</a>
  </nav>
</header>

<main class="main">
  <h1>Nossos Serviços</h1>
  <ul>
    <li>Painéis Gerenciais</li>
    <li>Prestação de Contas</li>
    <li>Gestão de Equipes</li>
  </ul>
</main>

<script>
(function () {
  'use strict';

  const EXPERIENCE_ID = '1c71651ddc4842a585a30dbdbd451a9c';
  const BASE_URL =
    'https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/';

  function buildUrl(page) {
    return `${BASE_URL}?id=${EXPERIENCE_ID}&page=${page}`;
  }

  function navigateTo(page) {
    if (!page) return;
    window.location.href = buildUrl(page);
  }

  function updateActiveNav() {
    const params = new URLSearchParams(window.location.search);
    const currentPage = params.get('page') || 'V-Geral';

    document.querySelectorAll('.nav a[data-page]').forEach(link => {
      link.classList.toggle('active', link.dataset.page === currentPage);
    });
  }

  document.querySelectorAll('.nav a[data-page]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      navigateTo(link.dataset.page);
    });
  });

  document.addEventListener('DOMContentLoaded', updateActiveNav);
  window.addEventListener('pageshow', updateActiveNav);
})();
</script>
</body>
</html>
