<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Permissions-Policy" content="attribution-reporting=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), join-ad-interest-group=(), run-ad-auction=(), browsing-topics=()">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
<meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
<title>Radar Político</title>
<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --text:#eaf5f2;
  --muted:#b9d6cd;
}
*{ box-sizing:border-box; }
html,body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
/* ===== BARRA DO TOPO ===== */
.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  height:3px;
  background: linear-gradient(to right, transparent 0%, var(--green) 30%, var(--green) 70%, transparent 100%);
  opacity:.85;
}
/* ===== FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}
.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.22;
  pointer-events:none;
}
.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.65), rgba(5,9,12,.92) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}
.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.55;
  pointer-events:none;
}
.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(from 0deg,
      transparent 0deg,
      rgba(31,227,162,.22) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}
@keyframes sweep{to{transform:rotate(360deg)}}
/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 48px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand .mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
}
.brand svg{width:22px;height:22px}
.brand .name{
  font-weight:700;
  font-size:14px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.brand .name span{
  display:block;
  color:var(--green);
  font-size:12px;
}
</style>
</head>
<body>

<!-- BARRA DO TOPO -->
<div class="top-bar"></div>

<!-- FUNDO -->
<div class="background">
  <img class="bg-map" src="mapa.png" alt="Mapa do Brasil" onerror="this.style.display='none'">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<!-- HEADER (logo removido) -->
<header class="header">
</header>

</body>
</html>
