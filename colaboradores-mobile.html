<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colaboradores | Radar Político (Mobile)</title>
<style>
:root{
  --green:#1fe3a2; --bg:#05090c; --text:#eaf5f2; --muted:#b9d6cd;
  --panel: rgba(18,40,38,.58); --panel2: rgba(8,20,18,.78);
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--text); overflow-x:hidden;}
.background{position:fixed; inset:0; z-index:0; overflow:hidden;}
.bg-map{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; opacity:.06; filter:blur(.2px) contrast(1.05); transform:scale(1.02); pointer-events:none;}
.bg-overlay{position:absolute; inset:0; background:radial-gradient(circle at top, rgba(14,43,38,.55), rgba(5,9,12,.94) 65%), linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.72)); pointer-events:none;}
.radar{position:absolute; inset:-40vmax; margin:auto; width:120vmax; height:120vmax; border-radius:50%;
  background:repeating-radial-gradient(circle, rgba(31,227,162,.05) 0 1px, transparent 1px 80px); opacity:.20; pointer-events:none;}
.header{position:relative; z-index:2; width:100%; padding:16px 18px; display:flex; flex-direction:column; gap:14px; align-items:flex-start;}
.brand{display:flex; align-items:center; gap:12px;}
.brand .mark{width:38px;height:38px;border-radius:12px;background:rgba(31,227,162,.12);border:1px solid rgba(31,227,162,.35);display:grid;place-items:center;box-shadow:0 0 24px rgba(31,227,162,.18);}
.brand svg{width:22px;height:22px;}
.brand .name{font-weight:700; letter-spacing:.14em; font-size:13px; text-transform:uppercase; line-height:1.1;}
.brand .name span{display:block; color:var(--green); letter-spacing:.22em; font-weight:700; font-size:11px;}
.nav{display:flex; gap:10px; flex-wrap:wrap; width:100%;}
.nav a{color:var(--text); text-decoration:none; font-size:13px; padding:8px 10px; border-radius:12px;}
.nav a.active{color:var(--green); background:rgba(31,227,162,.08); border:1px solid rgba(31,227,162,.18);}
.main{position:relative; z-index:2; padding:14px 18px 44px;}
.grid{display:grid; grid-template-columns:1fr; gap:14px;}
.frame{border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg, var(--panel), var(--panel2));
  box-shadow:0 24px 70px rgba(0,0,0,.55); backdrop-filter:blur(14px);
  min-height:260px; display:flex; flex-direction:column;
}
.frame-head{background:linear-gradient(180deg, rgba(0,175,120,.95), rgba(0,140,98,.95));
  color:#eafff7; font-weight:900; text-align:center; padding:10px 12px; font-size:14px;}
.frame-body{flex:1; padding:12px; display:grid; place-items:center;}
.placeholder{width:100%; height:100%; border-radius:14px; border:1px dashed rgba(255,255,255,.14);
  background:radial-gradient(circle at 25% 25%, rgba(31,227,162,.08), transparent 55%),
             linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.10));
  color:rgba(234,245,242,.55); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  display:grid; place-items:center; text-align:center; padding:16px;
}
</style>
</head>
<body>
<div class="background">
  <img class="bg-map" src="mapa.png" alt="" aria-hidden="true">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3" aria-hidden="true">
        <circle cx="32" cy="32" r="22"/><path d="M32 32L48 16"/><circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name"><span>RADAR</span>POLÍTICO</div>
  </div>
  <nav class="nav">
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=V-Geral">Visão Geral</a>
    <a class="active" href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=Colaboradores">Colaboradores</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=Prestação de Contas">Prestação de Contas</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=Whatsapp">Comunicação</a>
  </nav>
</header>

<main class="main">
  <section class="grid">
    <article class="frame">
      <div class="frame-head">Cadastro / Lista de Colaboradores</div>
      <div class="frame-body"><div class="placeholder">SURVEY / TABELA / WIDGET</div></div>
    </article>
    <article class="frame">
      <div class="frame-head">Indicadores / Mapa</div>
      <div class="frame-body"><div class="placeholder">KPI / MAPA / GRÁFICO</div></div>
    </article>
  </section>
</main>
</body>
</html>
