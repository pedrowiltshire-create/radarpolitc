<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Módulos do Radar | Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --border:rgba(255,255,255,.12);
  --text:#eaf5f2;
  --muted:#b9d6cd;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  min-height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:.12;
  filter: contrast(1.05);
  transform: scale(1.02);
  pointer-events:none;
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.55), rgba(5,9,12,.94) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.70));
  pointer-events:none;
}

.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.35;
  pointer-events:none;
}

.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(31,227,162,.18) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}

@keyframes sweep{ to{ transform:rotate(360deg); } }

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 48px;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.brand .mark{
  width:38px; 
  height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
}

.brand svg{ width:22px; height:22px; }

.brand .name{
  font-weight:700;
  letter-spacing:.14em;
  font-size:14px;
  text-transform:uppercase;
  line-height:1.1;
}

.brand .name span{
  display:block;
  color:var(--green);
  font-size:12px;
}

.nav{
  display:flex;
  gap:20px;
}

.nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  padding:8px 12px;
  border-radius:12px;
}

.nav a.active{
  color:var(--green);
}

/* ===== CONTEÚDO ===== */
.main{
  position:relative;
  z-index:2;
  padding:34px 48px 80px;
}

.wrap{
  max-width:1400px;
  margin:0 auto;
}

.modules{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:26px;
}

/* ===== CARD ===== */
.module{
  border-radius:22px;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(18,40,38,.62), rgba(8,20,18,.78));
}

.thumb{ height:160px; }

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.body{
  padding:18px;
  text-align:center;
}

.btn{
  display:block;
  margin-top:10px;
  padding:11px;
  border-radius:999px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="background">
  <img class="bg-map" src="mapa.png" alt="">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name"><span>RADAR</span> POLÍTICO</div>
  </div>
