<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prestação de Contas | Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --text:#eaf5f2;

  --panel: rgba(18,40,38,.58);
  --panel2: rgba(8,20,18,.78);
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow:hidden; /* página nunca rola */
}

/* ===== FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
}

.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.22;
  filter: blur(.15px) contrast(1.05);
  transform: scale(1.02);
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.45), rgba(5,9,12,.88) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.58));
}

.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.05) 0 1px,
      transparent 1px 80px
    );
  opacity:.2;
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 48px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand .mark{
  width:38px; height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
  box-shadow:0 0 24px rgba(31,227,162,.18);
}

.brand svg{ width:22px; height:22px; }

.brand .name{
  font-weight:700;
  letter-spacing:.14em;
  font-size:14px;
  text-transform:uppercase;
  line-height:1.1;
}
.brand .name span{
  display:block;
  color:var(--green);
  letter-spacing:.22em;
  font-weight:700;
  font-size:12px;
}

.nav{
  display:flex;
  gap:32px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  padding:8px 10px;
  border-radius:12px;
  transition:.2s;
}

.nav a:hover{
  background:rgba(31,227,162,.06);
  color:var(--green);
  transform:translateY(-1px);
}

.nav a.active{
  color:var(--green);
  background:rgba(31,227,162,.08);
  border:1px solid rgba(31,227,162,.18);
}


.main{
  position:relative;
  z-index:2;
  min-height:calc(100vh - 86px);
  padding:18px 48px 80px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.wrap{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  text-align:center;
}

/* topo grande */
.hero-title{
  margin:12px 0 10px;
  font-size:56px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.hero-title span{ color:var(--green); }

.hero-subtitle{
  margin:0 auto 26px;
  max-width:920px;
  color:rgba(234,245,242,.72);
  font-size:18px;
  line-height:1.7;
}

/* separador horizontal */
.hr{
  height:1px;
  background:rgba(255,255,255,.10);
  margin:24px 0 18px;
}

/* menu central */
.tabs{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
  padding:6px 0 4px;
}

.tabs a{
  color:rgba(234,245,242,.82);
  text-decoration:none;
  font-size:16px;
  padding:8px 10px;
  border-radius:12px;
  transition:.2s;
}

.tabs a:hover{
  color:var(--green);
  background:rgba(31,227,162,.06);
}

.tabs a.active{
  color:var(--green);
  background:rgba(31,227,162,.08);
  border:1px solid rgba(31,227,162,.18);
}

/* linha de texto central pequena */
.micro{
  margin:28px auto 34px;
  max-width:860px;
  color:rgba(234,245,242,.68);
  font-size:15.5px;
}

/* lista com checks verdes, alinhada à esquerda */
.list{
  width:100%;
  max-width:980px;
  margin:0 auto 44px;
  text-align:left;
  display:grid;
  gap:22px;
}

.item{
  display:grid;
  grid-template-columns:56px 1fr;
  gap:18px;
  align-items:flex-start;
}

.check{
  width:44px;
  height:44px;
  border-radius:999px;
  background:rgba(31,227,162,.16);
  border:1px solid rgba(31,227,162,.35);
  box-shadow:0 0 26px rgba(31,227,162,.25);
  display:grid;
  place-items:center;
}

.check::before{
  content:"✔";
  color:var(--green);
  font-weight:900;
  font-size:18px;
}

.item p{
  margin:0;
  color:rgba(234,245,242,.86);
  line-height:1.6;
  font-size:18px;
}

.item strong{
  color:var(--text);
  font-weight:900;
}


.cta{
  display:flex;
  justify-content:center;
}

.cta a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:18px 58px;
  border-radius:999px;
  font-size:20px;
  font-weight:800;
  color:#052116;
  text-decoration:none;
  background:linear-gradient(180deg, #6bff9d, var(--green));
  box-shadow:0 0 56px rgba(31,227,162,.45);
  border:1px solid rgba(255,255,255,.14);
  transition:.25s;
}

.cta a:hover{
  transform:translateY(-2px);
  box-shadow:0 0 72px rgba(31,227,162,.60);
}

/* ===== RESPONSIVO ===== */
@media(max-width:900px){
  .hero-title{ font-size:40px; letter-spacing:.12em; }
  .tabs{ gap:18px; }
  .item p{ font-size:16px; }
}

@media(max-width:700px){
  .header{
    padding:16px 18px;
    gap:16px;
    flex-direction:column;
    align-items:flex-start;
  }
  .nav{ gap:10px; }
  .main{ padding:18px 18px 54px; }
  .bg-map{ opacity:.06; }
}
</style>
</head>

<body>

<div class="background">
  <img class="bg-map" src="mapa.png" alt="" aria-hidden="true">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name">
      <span>RADAR</span>
      POLÍTICO
    </div>
  </div>

  <nav class="nav">
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=V-Geral">Visão Geral</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=Colaboradores">Colaboradores</a>
    <a class="active" href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=Prestação de Contas">Prestação de Contas</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&amp;page=Whatsapp">Comunicação</a>
  </nav>
</header>
</body>
</html>
