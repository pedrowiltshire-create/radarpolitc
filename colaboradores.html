<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- META TAGS PARA CORRIGIR POLICIES -->
<meta http-equiv="Permissions-Policy" content="attribution-reporting=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), join-ad-interest-group=(), run-ad-auction=(), browsing-topics=()">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
<meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">

<title>Colaboradores | Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --border:rgba(255,255,255,.12);
  --text:#eaf5f2;
  --muted:#b9d6cd;
  --panel: rgba(18,40,38,.58);
  --panel2: rgba(8,20,18,.78);
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* ===== FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:.16;
  filter: contrast(1.05);
  transform: scale(1.02);
  pointer-events:none;
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.65), rgba(5,9,12,.92) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}

.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.45;
  pointer-events:none;
}

.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(31,227,162,.22) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}

@keyframes sweep{ to{ transform:rotate(360deg); } }

@media (prefers-reduced-motion: reduce){
  .radar::after{ animation:none; }
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 48px;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand .mark{
  width:38px; 
  height:38px;
  border-radius:12px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
  box-shadow:0 0 24px rgba(31,227,162,.18);
}

.brand svg{ width:22px; height:22px; }

.brand .name{
  font-weight:700;
  letter-spacing:.14em;
  font-size:14px;
  text-transform:uppercase;
  line-height:1.1;
}

.brand .name span{
  display:block;
  color:var(--green);
  letter-spacing:.22em;
  font-size:12px;
}

.nav{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  padding:8px 12px;
  border-radius:12px;
  transition:.2s;
}

.nav a:hover{
  background:rgba(31,227,162,.06);
  color:var(--green);
}

.nav a.active{
  color:var(--green);
  background:rgba(31,227,162,.08);
  border:1px solid rgba(31,227,162,.18);
}

/* ===== CONTEÚDO ===== */
.main{
  position:relative;
  z-index:2;
  height:calc(100vh - 86px);
  padding:24px 48px 44px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.wrap{
  width:100%;
  max-width:1280px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}

.frame{
  border-radius:22px;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg, var(--panel), var(--panel2));
  box-shadow:0 40px 110px rgba(0,0,0,.65);
  min-height:440px;
}

@media(max-width:1100px){
  html,body{ overflow:auto; }
  .grid{ grid-template-columns:1fr; }
}

@media(max-width:700px){
  .header{
    padding:18px 32px;
    flex-direction:column;
    align-items:flex-start;
  }
  .nav{ gap:12px; }
  .main{ padding:16px 18px 38px; }
}
</style>
</head>

<body>

<div class="background">
  <img class="bg-map" src="mapa.png" alt="" onerror="this.style.display='none'">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<header class="header">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>
    <div class="name">
      <span>RADAR</span>POLÍTICO
    </div>
  </div>

  <nav class="nav">
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=V-Geral">Visão Geral</a>
    <a class="active" href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=Colaboradores">Colaboradores</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=Prestação de Contas">Prestação de Contas</a>
    <a href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c&page=Whatsapp">Comunicação</a>
  </nav>
</header>

<main class="main">
  <div class="wrap">
    <section class="grid">
      <!-- conteúdo -->
    </section>
  </div>
</main>

<!-- SCRIPT CORRETO (SEM BLOQUEIO DE CLIQUES) -->
<script>
(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (registrations) {
      registrations.forEach(function (registration) {
        if (registration.scope.includes('radarpolitico')) {
          registration.unregister();
        }
      });
    });
  }
})();
</script>

</body>
</html>
