<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Permissions-Policy" content="attribution-reporting=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), join-ad-interest-group=(), run-ad-auction=(), browsing-topics=()">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
<meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
<title>Radar Político</title>

<style>
:root{
  --green:#1fe3a2;
  --bg:#05090c;
  --border:rgba(255,255,255,.12);
  --text:#eaf5f2;
  --muted:#b9d6cd;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== CAMADAS DE FUNDO ===== */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

.bg-map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:.22;
  filter: contrast(1.05);
  transform: scale(1.02);
  pointer-events:none;
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(14,43,38,.65), rgba(5,9,12,.92) 65%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}

.radar{
  position:absolute;
  inset:-40vmax;
  margin:auto;
  width:120vmax;
  height:120vmax;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      rgba(31,227,162,.06) 0 1px,
      transparent 1px 80px
    );
  opacity:.55;
  pointer-events:none;
}

.radar::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(31,227,162,.22) 40deg,
      transparent 80deg
    );
  animation:sweep 7s linear infinite;
}

@keyframes sweep{
  to{transform:rotate(360deg)}
}

@media (prefers-reduced-motion: reduce){
  .radar::after{ animation:none; }
}

/* ===== CONTEÚDO ===== */
.main{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:48px 20px;
}

.card{
  width:100%;
  max-width:460px;
  padding:68px 52px;
  border-radius:32px;
  text-align:center;

  background:
    linear-gradient(180deg, rgba(18,40,38,.75), rgba(8,20,18,.85)),
    radial-gradient(circle at top right, rgba(31,227,162,.06), transparent 50%),
    radial-gradient(circle at bottom left, rgba(31,227,162,.04), transparent 50%);
  border:1.5px solid transparent;
  background-clip:padding-box;
  box-shadow:
    0 8px 32px rgba(0,0,0,.4),
    0 30px 80px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 -1px 0 rgba(0,0,0,.3);
  backdrop-filter: blur(24px) saturate(180%);
  
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:32px;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:-1.5px;
  border-radius:32px;
  padding:1.5px;
  background:linear-gradient(
    135deg,
    rgba(31,227,162,.4) 0%,
    rgba(31,227,162,.1) 25%,
    transparent 50%,
    rgba(31,227,162,.1) 75%,
    rgba(31,227,162,.4) 100%
  );
  background-size:200% 200%;
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:borderGlow 4s linear infinite;
  pointer-events:none;
}

@keyframes borderGlow{
  0%, 100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

.card::after{
  content:"";
  position:absolute;
  top:0;
  left:20%;
  right:20%;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(31,227,162,.5), transparent);
  opacity:.6;
}

.ambient-glow-top,
.ambient-glow-bottom{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(80px);
  opacity:.15;
}

.ambient-glow-top{
  top:-150px;
  right:-100px;
  background:radial-gradient(circle, rgba(31,227,162,.8), transparent 70%);
}

.ambient-glow-bottom{
  bottom:-150px;
  left:-100px;
  background:radial-gradient(circle, rgba(31,227,162,.6), transparent 70%);
}

@media (prefers-reduced-motion: reduce){
  .card::before{
    animation:none;
    background:linear-gradient(135deg, rgba(31,227,162,.3), rgba(31,227,162,.1));
  }
}

/* ===== LOGO ===== */
.logo{
  width:72px;
  height:72px;
  border-radius:18px;
  background:rgba(31,227,162,.12);
  border:1px solid rgba(31,227,162,.35);
  display:grid;
  place-items:center;
  box-shadow:0 0 30px rgba(31,227,162,.25);
  position:relative;
  overflow:hidden;
}

.logo::before{
  content:"";
  position:absolute;
  inset:-50%;
  background:conic-gradient(from 0deg, transparent, rgba(31,227,162,.15), transparent);
  animation:logoSpin 4s linear infinite;
}

@keyframes logoSpin{
  to{transform:rotate(360deg)}
}

.logo svg{
  width:40px;
  height:40px;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 0 8px rgba(31,227,162,.4));
}

/* ===== BRAND WRAPPER ===== */
.brand-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  position:relative;
}

h1{
  margin:0;
  font-size:clamp(36px, 6vw, 52px);
  font-weight:900;
  line-height:1;
  letter-spacing:-.02em;
  background:linear-gradient(135deg, #ffffff 0%, #e8f5f1 50%, #ffffff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 3s ease-in-out infinite;
  text-transform:uppercase;
  position:relative;
}

@keyframes shimmer{
  0%, 100%{background-position:0% center}
  50%{background-position:100% center}
}

h1::after{
  content:"POLÍTICO";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.2) 0%, transparent 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:blur(12px);
  z-index:-1;
}

/* ===== BRAND SUBTITLE — ajustado ===== */
.brand-subtitle{
  font-size:8px;            /* era 10px */
  letter-spacing:.3em;      /* era .45em — principal causa do tamanho excessivo */
  font-weight:600;
  color:rgba(31,227,162,.65);
  text-transform:uppercase;
  margin-top:6px;
  display:flex;
  align-items:center;
  gap:6px;                  /* era 8px */
}

.brand-subtitle::before,
.brand-subtitle::after{
  content:"";
  width:16px;               /* era 24px */
  height:1px;
  background:linear-gradient(90deg, transparent, var(--green), transparent);
}

/* Partículas decorativas */
.particles{
  position:absolute;
  inset:-20px;
  pointer-events:none;
  overflow:hidden;
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:var(--green);
  border-radius:50%;
  opacity:0;
  animation:float 4s ease-in-out infinite;
  box-shadow:0 0 10px var(--green);
}

.particle:nth-child(1){left:10%; animation-delay:0s; animation-duration:3s;}
.particle:nth-child(2){left:30%; animation-delay:1s; animation-duration:4s;}
.particle:nth-child(3){left:50%; animation-delay:2s; animation-duration:3.5s;}
.particle:nth-child(4){left:70%; animation-delay:0.5s; animation-duration:4.5s;}
.particle:nth-child(5){left:90%; animation-delay:1.5s; animation-duration:3.8s;}

@keyframes float{
  0%, 100%{
    transform:translateY(40px);
    opacity:0;
  }
  10%, 90%{
    opacity:.6;
  }
  50%{
    transform:translateY(-40px);
    opacity:.8;
  }
}

@media (prefers-reduced-motion: reduce){
  .logo::before,
  h1,
  .particle{
    animation:none !important;
  }
}

/* ===== BOTÃO ===== */
.btn-access{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:13px 36px;
  border-radius:50px;
  font-weight:700;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  text-decoration:none;
  color:#000;
  background:linear-gradient(135deg, #1fe3a2, #00ffc8);
  border:none;
  box-shadow:
    0 0 0 0 rgba(31,227,162,.4),
    0 12px 32px rgba(31,227,162,.35),
    inset 0 -2px 8px rgba(0,0,0,.15);
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

.btn-access::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, transparent, rgba(255,255,255,.3), transparent);
  transform:translateX(-100%);
  transition:transform .6s ease;
}

.btn-access::after{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(135deg, #1fe3a2, #00ffc8, #1fe3a2);
  border-radius:50px;
  z-index:-1;
  opacity:0;
  filter:blur(12px);
  transition:opacity .4s ease;
}

.btn-access:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:
    0 0 30px 5px rgba(31,227,162,.6),
    0 20px 48px rgba(31,227,162,.45),
    inset 0 -2px 8px rgba(0,0,0,.15);
  letter-spacing:.12em;
}

.btn-access:hover::before{
  transform:translateX(100%);
}

.btn-access:hover::after{
  opacity:1;
}

.btn-access:active{
  transform:translateY(-2px) scale(.98);
}

/* ===== MOBILE ===== */
@media(max-width:700px){
  .card{
    padding:56px 36px;
    gap:28px;
    max-width:90%;
  }
  
  h1{
    font-size:clamp(32px, 8vw, 42px);
  }
  
  .brand-subtitle{
    font-size:7px;
    letter-spacing:.28em;
  }
  
  .btn-access{
    padding:12px 32px;
    font-size:12px;
  }
  
  .bg-map{
    opacity:.12;
    object-position:center center;
  }
}

@media(max-width:400px){
  .card{
    padding:48px 28px;
    border-radius:24px;
  }
  
  h1{
    font-size:28px;
  }
  
  .brand-subtitle{
    font-size:6px;
    letter-spacing:.25em;
  }
  
  .brand-subtitle::before,
  .brand-subtitle::after{
    width:12px;
  }
  
  .btn-access{
    width:100%;
    padding:12px 28px;
  }
}
</style>
</head>

<body>

<div class="background">
  <img class="bg-map" src="mapa.png" alt="Mapa do Brasil" onerror="this.style.display='none'">
  <div class="bg-overlay"></div>
  <div class="radar"></div>
</div>

<main class="main">
  <div class="card">
    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom"></div>

    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--green)" stroke-width="3" aria-hidden="true">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 32L48 16"/>
        <circle cx="32" cy="32" r="4" fill="var(--green)"/>
      </svg>
    </div>

    <div class="brand-wrapper">
      <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>
      <h1>POLÍTICO</h1>
      <div class="brand-subtitle">RADAR</div>
    </div>

    <a class="btn-access" href="https://gis.radarpolitico.org/portal/apps/experiencebuilder/experience/?id=1c71651ddc4842a585a30dbdbd451a9c">
      Acessar
    </a>

  </div>
</main>

<script>
(function() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        if(registration.scope.includes('radarpolitico')) {
          registration.unregister();
        }
      }
    });
  }

  let canNavigate = true;
  const btnAccess = document.querySelector('.btn-access');
  
  if(btnAccess) {
    btnAccess.addEventListener('click', function(e) {
      if (!canNavigate) {
        e.preventDefault();
        return false;
      }
      canNavigate = false;
      setTimeout(function() { canNavigate = true; }, 1500);
    });
  }
})();
</script>
</body>
</html>
